<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Form Finale</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; max-width: 700px; margin: 0 auto; }
    input, button { width: 100%; padding: 12px; margin-top: 12px; box-sizing: border-box; }
    pre { background:#eef8fa; padding:12px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Test Form Finale</h1>

  <form action="https://script.google.com/macros/s/AKfycbysy72IU_DYzjzIEzVzcOwtoMkx6Vwdwzo5Kb_UGsIJ_aIxBxs4RbZYcp0cMxNVp8z_ug/exec" method="post" target="hiddenFrame">
    <input type="text" name="ping" value="1">
    <input type="text" name="test" value="ok">
    <button type="submit">Invia form</button>
  </form>

  <iframe name="hiddenFrame" style="display:none;"></iframe>

  <pre id="out">Premi il pulsante per inviare il form.</pre>

  <script>
    const out = document.getElementById("out");
    document.querySelector("form").addEventListener("submit", function () {
      out.textContent = "Form inviato. Controlla Apps Script > Executions.";
    });
  </script>
</body>
</html>
