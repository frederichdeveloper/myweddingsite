<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test GET Google Apps Script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(180deg, #eef8fa 0%, #d6f0f4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.12);
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      color: #0a4f5c;
      text-align: center;
      font-size: 1.6rem;
    }
    p {
      margin: 0 0 18px;
      color: #4f6f76;
      text-align: center;
      line-height: 1.5;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      color: #fff;
      background: #0a4f5c;
    }
    .secondary {
      background: #c8a84b;
      color: #0d3540;
    }
    .status {
      min-height: 24px;
      text-align: center;
      margin-top: 8px;
      color: #1a5f70;
    }
    .status.error { color: #c62828; }
    .status.success { color: #2e7d32; }
    pre {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #eef8fa;
      color: #0a4f5c;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.5;
    }
    pre.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Test Google Apps Script</h1>
    <p>Premi il pulsante per verificare se l’endpoint risponde con JSON.</p>

    <button id="btn-test">Test GET</button>
    <button id="btn-clear" class="secondary">Pulisci log</button>

    <div id="status" class="status" aria-live="polite"></div>
    <pre id="output"></pre>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "INSERISCI_QUI_IL_TUO_URL_EXEC";
    const btnTest = document.getElementById("btn-test");
    const btnClear = document.getElementById("btn-clear");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function showOutput(text) {
      outputEl.textContent = text;
      outputEl.classList.add("visible");
    }

    btnClear.addEventListener("click", function () {
      statusEl.textContent = "";
      outputEl.textContent = "";
      outputEl.classList.remove("visible");
    });

    btnTest.addEventListener("click", async function () {
      try {
        setStatus("Invio richiesta GET...");
        outputEl.classList.remove("visible");

        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: "GET",
          redirect: "follow"
        });

        const text = await res.text();

        setStatus("Risposta ricevuta.", "success");
        showOutput("HTTP STATUS: " + res.status + "\n\n" + text);
      } catch (err) {
        setStatus("Errore durante il test GET.", "error");
        showOutput("ERROR:\n" + (err && err.message ? err.message : String(err)));
      }
    });
  </script>
</body>
</html>
