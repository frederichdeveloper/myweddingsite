<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carica Foto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="drive-camera-page">
    <section class="drive-camera-section">
      <div class="drive-camera-container">
        <h1 class="drive-camera-title">Carica una foto</h1>
        <p class="drive-camera-subtitle">Scatta una foto e inviala direttamente nella cartella Google Drive.</p>

        <div class="drive-camera-preview">
          <video id="camera-video" class="drive-camera-video" autoplay playsinline muted></video>
          <canvas id="camera-canvas" class="drive-camera-canvas" style="display:none;"></canvas>
        </div>

        <div class="drive-camera-actions">
          <button type="button" id="btn-avvia-camera" class="drive-camera-btn drive-camera-btn-primary">
            Avvia fotocamera
          </button>
          <button type="button" id="btn-scatta-foto" class="drive-camera-btn drive-camera-btn-secondary" disabled>
            Scatta e invia
          </button>
        </div>

        <div id="status-messaggio" class="drive-camera-status" aria-live="polite"></div>

        <pre id="debug-box" style="display:none; white-space:pre-wrap; margin-top:14px; font-size:12px; line-height:1.5; background:#eef8fa; color:#0a4f5c; padding:12px; border-radius:12px;"></pre>

        <button type="button" id="copy-debug-btn" style="display:none; margin-top:10px; width:100%; border:none; border-radius:12px; padding:12px 16px; background:#0a4f5c; color:#fff; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; cursor:pointer;">
          Copia errore
        </button>
      </div>
    </section>
  </main>

  <div id="site-footer-slot"></div>

  <script>
    function loadComponent(url, targetId) {
      fetch(url)
        .then(function(res) { return res.text(); })
        .then(function(html) {
          var el = document.getElementById(targetId);
          if (el) el.innerHTML = html;
        })
        .catch(function(err) {
          console.warn('Componente non caricato:', err);
        });
    }

    loadComponent('components/header.html', 'site-header');
    loadComponent('components/footer.html', 'site-footer-slot');

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCwgrsel-sKVjTh1IxQBk4pbf4yMGcrHoYETnxPCQIZFWfQi-wplde4nNFLMGqD88bsg/exec";

    (function () {
      const video = document.getElementById("camera-video");
      const canvas = document.getElementById("camera-canvas");
      const btnStart = document.getElementById("btn-avvia-camera");
      const btnShot = document.getElementById("btn-scatta-foto");
      const statusEl = document.getElementById("status-messaggio");
      const debugBox = document.getElementById("debug-box");
      const copyBtn = document.getElementById("copy-debug-btn");

      if (!video || !canvas || !btnStart || !btnShot || !statusEl) return;

      let stream = null;

      function setStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.classList.remove("error", "success");
        if (type) statusEl.classList.add(type);
      }

      function showDebug(text) {
        debugBox.style.display = "block";
        debugBox.textContent = text;
        copyBtn.style.display = "block";
      }

      copyBtn.addEventListener("click", async function () {
        try {
          await navigator.clipboard.writeText(debugBox.textContent || "");
          copyBtn.textContent = "Copiato!";
          setTimeout(function () { copyBtn.textContent = "Copia errore"; }, 1200);
        } catch (e) {
          console.warn(e);
        }
      });

      async function startCamera() {
        try {
          setStatus("Attivazione fotocamera...");
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
          });

          video.srcObject = stream;
          await video.play();
          btnShot.disabled = false;
          setStatus("Fotocamera attiva. Puoi scattare la foto.");
        } catch (error) {
          console.error(error);
          setStatus("Impossibile attivare la fotocamera.", "error");
          showDebug("CAMERA ERROR:\n" + (error && error.message ? error.message : String(error)));
        }
      }

      function dataURLToBlob(dataUrl) {
        const parts = dataUrl.split(",");
        const mime = parts[0].match(/:(.*?);/)[1];
        const binary = atob(parts[1]);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      async function captureAndSend() {
        if (!stream) {
          setStatus("Prima avvia la fotocamera.", "error");
          return;
        }

        try {
          setStatus("Scatto...");

          const videoWidth = video.videoWidth;
          const videoHeight = video.videoHeight;

          if (!videoWidth || !videoHeight) {
            throw new Error("Dimensioni video non disponibili");
          }

          canvas.width = videoWidth;
          canvas.height = videoHeight;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0, videoWidth, videoHeight);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
          const blob = dataURLToBlob(dataUrl);
          const fileReader = new FileReader();

          fileReader.onloadend = async function () {
            try {
              setStatus("Caricamento su Google Drive...");

              const base64Image = fileReader.result.split(",")[1];
              const payload = JSON.stringify({
                imageBase64: base64Image,
                mimeType: blob.type,
                fileName: `foto_${Date.now()}.jpg`
              });

              const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "cors",
                redirect: "follow",
                headers: {
                  "Content-Type": "text/plain;charset=utf-8"
                },
                body: payload
              });

              const responseText = await response.text();

              showDebug(
                "HTTP STATUS: " + response.status + "\n\n" +
                "RAW RESPONSE:\n" + responseText
              );

              if (!responseText.trim().startsWith("{")) {
                setStatus("Il server ha risposto con HTML o errore di login.", "error");
                return;
              }

              let parsed;
              try {
                parsed = JSON.parse(responseText);
              } catch (err) {
                setStatus("Risposta non JSON.", "error");
                showDebug(
                  "JSON PARSE ERROR:\n" +
                  (err && err.message ? err.message : String(err)) +
                  "\n\nRAW RESPONSE:\n" + responseText
                );
                return;
              }

              if (!response.ok) {
                throw new Error("HTTP " + response.status + " - " + responseText);
              }

              if (!parsed.success) {
                throw new Error(parsed.message || "Errore Apps Script");
              }

              setStatus("✅ Foto salvata con successo!", "success");
            } catch (error) {
              console.error(error);
              setStatus("Errore durante il caricamento della foto.", "error");
              showDebug(
                "REQUEST ERROR:\n" +
                (error && error.message ? error.message : String(error))
              );
            }
          };

          fileReader.readAsDataURL(blob);
        } catch (error) {
          console.error(error);
          setStatus("Errore durante lo scatto.", "error");
          showDebug(
            "CAPTURE ERROR:\n" +
            (error && error.message ? error.message : String(error))
          );
        }
      }

      btnStart.addEventListener("click", startCamera);
      btnShot.addEventListener("click", captureAndSend);

      window.addEventListener("beforeunload", function () {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      });
    })();
  </script>
</body>
</html>
