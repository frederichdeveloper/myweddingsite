<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carica Foto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="drive-camera-page">
  <section class="drive-camera-section">
    <div class="drive-camera-container">
      <h1 class="drive-camera-title">Carica una foto</h1>
      <p class="drive-camera-subtitle">
        Seleziona una foto dal tuo dispositivo e inviala direttamente nella cartella Google Drive.
      </p>

      <div class="drive-camera-preview">
        <img id="preview-img" class="drive-camera-preview-img" alt="Anteprima foto selezionata" style="display:none;">
        <div id="preview-placeholder" class="drive-camera-preview-placeholder">
          Nessuna foto selezionata
        </div>
      </div>

      <label for="file-input" class="drive-camera-btn drive-camera-btn-primary" style="display:block; text-align:center; margin-bottom:12px; cursor:pointer;">
        Scegli foto
      </label>
      <input type="file" id="file-input" accept="image/*" style="display:none;">

      <button type="button" id="btn-invia-foto" class="drive-camera-btn drive-camera-btn-secondary" disabled>
        Carica Foto
      </button>

      <div id="status-messaggio" class="drive-camera-status" aria-live="polite"></div>

      <pre id="debug-box" style="display:none; white-space:pre-wrap; margin-top:14px; font-size:12px; line-height:1.5; background:#eef8fa; color:#0a4f5c; padding:12px; border-radius:12px;"></pre>

      <button type="button" id="copy-debug-btn" style="display:none; margin-top:10px; width:100%; border:none; border-radius:12px; padding:12px 16px; background:#0a4f5c; color:#fff; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; cursor:pointer;">
        Copia errore
      </button>
    </div>
  </section>
</main>

  <div id="site-footer-slot"></div>

  <script>
  function loadComponent(url, targetId) {
    fetch(url)
      .then(function(res) { return res.text(); })
      .then(function(html) {
        var el = document.getElementById(targetId);
        if (el) el.innerHTML = html;
      })
      .catch(function(err) {
        console.warn('Componente non caricato:', err);
      });
  }

  loadComponent('components/header.html', 'site-header');
  loadComponent('components/footer.html', 'site-footer-slot');

  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCwgrsel-sKVjTh1IxQBk4pbf4yMGcrHoYETnxPCQIZFWfQi-wplde4nNFLMGqD88bsg/exec";

  (function () {
    const fileInput = document.getElementById("file-input");
    const btnSend = document.getElementById("btn-invia-foto");
    const statusEl = document.getElementById("status-messaggio");
    const debugBox = document.getElementById("debug-box");
    const copyBtn = document.getElementById("copy-debug-btn");
    const previewImg = document.getElementById("preview-img");
    const previewPlaceholder = document.getElementById("preview-placeholder");

    if (!fileInput || !btnSend || !statusEl) return;

    let selectedFile = null;

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.classList.remove("error", "success");
      if (type) statusEl.classList.add(type);
    }

    function showDebug(text) {
      debugBox.style.display = "block";
      debugBox.textContent = text;
      copyBtn.style.display = "block";
    }

    copyBtn.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(debugBox.textContent || "");
        copyBtn.textContent = "Copiato!";
        setTimeout(function () { copyBtn.textContent = "Copia errore"; }, 1200);
      } catch (e) {
        console.warn(e);
      }
    });

    fileInput.addEventListener("change", function () {
      selectedFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;

      if (!selectedFile) {
        btnSend.disabled = true;
        previewImg.style.display = "none";
        previewPlaceholder.style.display = "block";
        previewPlaceholder.textContent = "Nessuna foto selezionata";
        setStatus("");
        return;
      }

      if (!selectedFile.type.startsWith("image/")) {
        btnSend.disabled = true;
        setStatus("Seleziona un file immagine valido.", "error");
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        previewImg.src = e.target.result;
        previewImg.style.display = "block";
        previewPlaceholder.style.display = "none";
      };
      reader.readAsDataURL(selectedFile);

      btnSend.disabled = false;
      setStatus("Foto selezionata. Pronta per l'invio.");
    });

    function fileToBase64(file) {
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() {
          const dataUrl = reader.result;
          resolve(dataUrl.split(",")[1]);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    btnSend.addEventListener("click", async function () {
      if (!selectedFile) {
        setStatus("Prima seleziona una foto.", "error");
        return;
      }

      try {
        setStatus("Conversione e caricamento su Google Drive...");

        const base64Image = await fileToBase64(selectedFile);
        const payload = JSON.stringify({
          imageBase64: base64Image,
          mimeType: selectedFile.type || "image/jpeg",
          fileName: selectedFile.name || ("foto_" + Date.now() + ".jpg")
        });

        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: payload
        });

        const responseText = await response.text();

        showDebug(
          "HTTP STATUS: " + response.status + "\n\n" +
          "RAW RESPONSE:\n" + responseText
        );

        if (!responseText.trim().startsWith("{")) {
          setStatus("Il server ha risposto con HTML o errore di login.", "error");
          return;
        }

        const parsed = JSON.parse(responseText);

        if (!response.ok) {
          throw new Error("HTTP " + response.status + " - " + responseText);
        }

        if (!parsed.success) {
          throw new Error(parsed.message || "Errore Apps Script");
        }

        setStatus("✅ Foto inviata con successo!", "success");
      } catch (error) {
        console.error(error);
        setStatus("Errore durante il caricamento della foto.", "error");
        showDebug(
          "REQUEST ERROR:\n" +
          (error && error.message ? error.message : String(error))
        );
      }
    });
  })();
</script>
</body>
</html>
