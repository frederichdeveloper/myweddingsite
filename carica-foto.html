<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carica Foto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="drive-camera-page">
  <section class="drive-camera-section">
    <div class="drive-camera-container">
      <h1 class="drive-camera-title">Carica una foto</h1>
      <p class="drive-camera-subtitle">
        Seleziona una foto dal tuo dispositivo e inviala direttamente nella cartella condivisa degli SPOSI.
      </p>

      <div class="drive-camera-preview">
        <img id="preview-img" class="drive-camera-preview-img" alt="Anteprima foto selezionata" style="display:none;">
        <div id="preview-placeholder" class="drive-camera-preview-placeholder">
          Nessuna foto selezionata
        </div>
      </div>

     <label for="file-input" class="drive-camera-btn drive-camera-btn-primary drive-camera-label-btn">
  Scegli foto
</label>
<input type="file" id="file-input" class="drive-camera-file" accept="image/*" multiple>
<br>
<button type="button" id="btn-invia-foto" class="drive-camera-btn drive-camera-btn-secondary" disabled>
  Carica Foto
</button>

<div id="preview-list" class="drive-preview-list"></div>


      <div id="status-messaggio" class="drive-camera-status" aria-live="polite"></div>

      <pre id="debug-box" style="display:none; white-space:pre-wrap; margin-top:14px; font-size:12px; line-height:1.5; background:#eef8fa; color:#0a4f5c; padding:12px; border-radius:12px;"></pre>

      <button type="button" id="copy-debug-btn" style="display:none; margin-top:10px; width:100%; border:none; border-radius:12px; padding:12px 16px; background:#0a4f5c; color:#fff; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; cursor:pointer;">
        Copia errore
      </button>
    </div>
  </section>
</main>

  <div id="site-footer-slot"></div>

  <script>
  function loadComponent(url, targetId) {
    fetch(url)
      .then(function(res) { return res.text(); })
      .then(function(html) {
        var el = document.getElementById(targetId);
        if (el) el.innerHTML = html;
      })
      .catch(function(err) {
        console.warn('Componente non caricato:', err);
      });
  }

  loadComponent('components/header.html', 'site-header');
  loadComponent('components/footer.html', 'site-footer-slot');

  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwduJOML_rUo5SBj69u7wpMJT0nMkr5DQORDvbV-ZMlCfFXIweqpvV4EC_ERjJD9sWJuQ/exec";

  (function () {
    const fileInput = document.getElementById("file-input");
    const btnSend = document.getElementById("btn-invia-foto");
    const statusEl = document.getElementById("status-messaggio");
    const debugBox = document.getElementById("debug-box");
    const copyBtn = document.getElementById("copy-debug-btn");
    const previewList = document.getElementById("preview-list");

    if (!fileInput || !btnSend || !statusEl) return;

    let selectedFiles = [];

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.classList.remove("error", "success");
      if (type) statusEl.classList.add(type);
    }

    function hideDebug() {
      debugBox.style.display = "none";
      debugBox.textContent = "";
      copyBtn.style.display = "none";
      copyBtn.textContent = "Copia errore";
    }

    function showDebug(text) {
      debugBox.style.display = "block";
      debugBox.textContent = text;
      copyBtn.style.display = "block";
    }

    copyBtn.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(debugBox.textContent || "");
        copyBtn.textContent = "Copiato!";
        setTimeout(function () { copyBtn.textContent = "Copia errore"; }, 1200);
      } catch (e) {
        console.warn(e);
      }
    });

    function renderPreviews(files) {
      previewList.innerHTML = "";
      files.forEach(function(file) {
        const item = document.createElement("div");
        item.className = "drive-preview-item";

        const img = document.createElement("img");
        img.alt = file.name;

        const info = document.createElement("div");
        info.className = "drive-preview-item-info";
        info.textContent = file.name;

        const reader = new FileReader();
        reader.onload = function (e) {
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);

        item.appendChild(img);
        item.appendChild(info);
        previewList.appendChild(item);
      });
    }

    fileInput.addEventListener("change", function () {
      selectedFiles = fileInput.files ? Array.from(fileInput.files) : [];
      hideDebug();

      if (!selectedFiles.length) {
        btnSend.disabled = true;
        previewList.innerHTML = "";
        setStatus("");
        return;
      }

      const validFiles = selectedFiles.filter(function(file) {
        return file.type && file.type.startsWith("image/");
      });

      if (!validFiles.length) {
        btnSend.disabled = true;
        setStatus("Seleziona uno o più file immagine validi.", "error");
        previewList.innerHTML = "";
        return;
      }

      selectedFiles = validFiles;
      renderPreviews(selectedFiles);
      btnSend.disabled = false;
      setStatus(selectedFiles.length + " foto selezionate. Pronte per l'invio.");
    });

    function fileToBase64(file) {
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() {
          resolve(reader.result.split(",")[1]);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadSingleFile(file) {
      const base64Image = await fileToBase64(file);

      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        redirect: "follow",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          imageBase64: base64Image,
          mimeType: file.type || "image/jpeg",
          fileName: file.name || ("foto_" + Date.now() + ".jpg")
        })
      });

      const responseText = await response.text();

      if (!response.ok || !responseText.trim().startsWith("{")) {
        throw new Error("Upload fallito per " + file.name + " - " + responseText);
      }

      const parsed = JSON.parse(responseText);

      if (!parsed.success) {
        throw new Error(parsed.message || ("Errore Apps Script per " + file.name));
      }

      return parsed;
    }

    btnSend.addEventListener("click", async function () {
      if (!selectedFiles.length) {
        setStatus("Prima seleziona almeno una foto.", "error");
        return;
      }

      try {
        hideDebug();
        btnSend.disabled = true;
        setStatus("Caricamento di " + selectedFiles.length + " foto su Google Drive...");

        const results = [];
        for (let i = 0; i < selectedFiles.length; i++) {
          setStatus("Caricamento foto " + (i + 1) + " di " + selectedFiles.length + "...");
          const result = await uploadSingleFile(selectedFiles[i]);
          results.push(result);
        }

        setStatus("✅ Foto inviate con successo!", "success");
        hideDebug();
        selectedFiles = [];
        fileInput.value = "";
        previewList.innerHTML = "";
      } catch (error) {
        console.error(error);
        setStatus("Foto non inviata", "error");
        showDebug("REQUEST ERROR:\n" + (error && error.message ? error.message : String(error)));
      } finally {
        btnSend.disabled = selectedFiles.length === 0;
      }
    });
  })();
</script>
</body>
</html>
