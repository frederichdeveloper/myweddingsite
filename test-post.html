<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test POST semplice</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; max-width: 700px; margin: 0 auto; }
    textarea, button { width: 100%; margin-top: 12px; padding: 12px; }
    pre { background:#eef8fa; padding:12px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Test POST semplice</h1>
  <textarea id="payload">ping=1&test=ok</textarea>
  <button id="send">Invia</button>
  <pre id="out"></pre>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysy72IU_DYzjzIEzVzcOwtoMkx6Vwdwzo5Kb_UGsIJ_aIxBxs4RbZYcp0cMxNVp8z_ug/exec";
    const out = document.getElementById("out");

    document.getElementById("send").addEventListener("click", async () => {
      try {
        const payload = document.getElementById("payload").value;
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: payload
        });
        out.textContent = "Richiesta inviata. Controlla Apps Script > Executions.";
      } catch (e) {
        out.textContent = "ERRORE: " + e.message;
      }
    });
  </script>
</body>
</html>
