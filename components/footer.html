<!-- ═══════════════════════════════════════════
     FOOTER — card footer + site footer
     Incluso via script in index.html
     File: components/footer.html
═══════════════════════════════════════════ -->

<!-- Wave di chiusura -->
<div class="wave-divider" style="background:#e8f8ee;">
  <svg viewBox="0 0 480 28" preserveAspectRatio="none"
       xmlns="http://www.w3.org/2000/svg"
       style="display:block;width:100%;height:28px;">
    <path d="M0,0 C80,28 200,4 320,22 C400,36 450,8 480,16 L480,28 L0,28 Z"
          fill="#0a4f5c"/>
  </svg>
</div>

<!-- Footer della card -->
<footer class="card-footer">
  <div class="footer-ornament">♡ ♡ ♡</div>
  <div class="footer-tagline">
    Non vediamo l'ora<br>
    di condividere questo giorno speciale<br>
    con voi.<br><br>
    <strong>Vi aspettiamo!</strong>
  </div>
  <nav class="footer-links" aria-label="Footer navigation">
    <a href="index.html#cerimonia" class="footer-link">Cerimonia</a>
    <a href="index.html#dresscode" class="footer-link">Dress Code</a>
    <a href="index.html#location"  class="footer-link">Location</a>
    <a href="index.html#rsvp"      class="footer-link">Conferma</a>
  </nav>
  <div class="footer-date-stamp">26 · 07 · 2026 · Anzio · Roma</div>
</footer>

<!-- Site footer full-width (fuori dalla card) -->
<script>
  (function() {
    var sf = document.createElement('footer');
    sf.className = 'site-footer';
    sf.innerHTML = '<p>Matrimonio 26 Luglio 2026 &middot; Sunset House Events &middot; Via Ardeatina 53, Anzio (RM) &middot; <a href="index.html#rsvp" style="color:rgba(255,255,255,0.4);text-decoration:none;">RSVP</a></p>';
    var wrapper = document.querySelector('.site-wrapper');
    if (wrapper && wrapper.parentNode) {
      wrapper.parentNode.insertBefore(sf, wrapper.nextSibling);
    } else {
      document.body.appendChild(sf);
    }
  })();
</script>
